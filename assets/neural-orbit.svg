<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" fill="none">
  <defs>
    <linearGradient id="trace" x1="156" y1="81" x2="285" y2="143" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A58CEB"/><stop offset=".52" stop-color="#7864D2"/><stop offset="1" stop-color="#5ABBBF"/>
    </linearGradient>
    <linearGradient id="surface" x1="171" y1="48" x2="282" y2="177" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF"/><stop offset="1" stop-color="#EEECFA"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#C9BDF2" stop-opacity=".26"/><stop offset="1" stop-color="#C9BDF2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#8B7EB0" flood-opacity=".13"/>
    </filter>
    <style>
      .orbit-flow{stroke-dasharray:5 16;animation:flow 34s linear infinite}
      .orbit-flow.reverse{animation-direction:reverse;animation-duration:42s}
      .pulse{animation:breathe 5s ease-in-out infinite}
      .pulse.late{animation-delay:-2.5s}
      .signal{stroke-dasharray:320;stroke-dashoffset:0;animation:signal 9s ease-in-out infinite}
      .neural-core{animation:float 7s ease-in-out infinite;transform-origin:220px 110px}
      @keyframes flow{to{stroke-dashoffset:-420}}
      @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.7}}
      @keyframes signal{0%,100%{opacity:.65}50%{opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @media(prefers-reduced-motion:reduce){.orbit-flow,.pulse,.signal,.neural-core{animation:none}}
    </style>
  </defs>
  <ellipse cx="220" cy="111" rx="192" ry="106" fill="url(#halo)"/>
